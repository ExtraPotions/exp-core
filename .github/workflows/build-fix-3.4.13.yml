name: Build fix 3.4.13 artifacts
on:
  push:
    branches: [fix/diagnostic-redaction-3.4.13]
    paths: [.core-build-trigger]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/diagnostic-redaction-3.4.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Commit generated Core artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add dist/exp-core.js dist/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build exp-core 3.4.13 artifacts"
          git push origin HEAD:fix/diagnostic-redaction-3.4.13
