name: Integrate Core-owned menu behavior
on:
  push:
    branches: [release/core-menu-3.4.10]
    paths: [.release-staging/**, .github/workflows/integrate-core-menu.yml]
permissions:
  contents: write
concurrency:
  group: integrate-core-menu-3.4.10
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: exp-core
          fetch-depth: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify and apply reviewed patches to isolated checkouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for name in Dropper SHIFT WARD PRISMA; do git clone --quiet --depth=1 "https://github.com/ExtraPotions/$name.git" "$name"; done
          test "$(git -C Dropper rev-parse HEAD)" = cfd6ed4a09b4568c527094f84086d3e67b1ff7ef
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          specs = [('core-menu', 'exp-core', '50f0235bead2104c54bc4250b928b6225c27cf147f2c26f2a622d4af2b9d61bd'), ('dropper-menu', 'Dropper', 'bd9ce1bb0d8213c040bc4f3c893b2352bd7c87a4ff4f2533b0ffe8e7830b91ee')]
          for name, repo, expected in specs:
              encoded = pathlib.Path('exp-core/.release-staging/' + name + '.b64').read_text().strip()
              if name == 'core-menu': encoded = encoded.replace('HskX0vq9/pyj', 'HskX0vq9/08pyj')
              if name == 'dropper-menu': encoded = encoded.replace('VryXWk/IeRZ', 'VryXyWk/IeRZ')
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(patch).hexdigest()
              if actual != expected: raise RuntimeError(name + ' source checksum mismatch: ' + actual)
              target = pathlib.Path('evidence/' + name + '.patch').resolve()
              target.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', str(target)], cwd=repo, check=True)
              subprocess.run(['git', 'apply', str(target)], cwd=repo, check=True)
              print('Verified', name, actual, flush=True)
          PY
          cp exp-core/.release-staging/dropper-menu-coordination.test.cjs Dropper/tests/menu-coordination.test.cjs
          cp Dropper/tests/menu-coordination.test.cjs evidence/dropper-menu-coordination.test.cjs
      - name: Install locked dependencies and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in exp-core Dropper SHIFT WARD PRISMA; do (cd "$name" && npm ci) > "evidence/$name-install.txt" 2>&1; done
          cd exp-core
          npx playwright install --with-deps chromium
      - name: Build Core and inject through the canonical consumer path
        shell: bash
        run: |
          set -euo pipefail
          cd exp-core
          npm run build
          node scripts/sync-products.cjs
          npm run sync:check
          node scripts/check-core-duplicates.cjs --enforce | tee ../evidence/ownership-scan.txt
      - name: Run all product and Core regression suites
        env:
          EXP_SUITE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          result=0
          for name in Dropper SHIFT WARD PRISMA exp-core; do
            if ! (cd "$name" && npm test) > "evidence/$name-tests.txt" 2>&1; then
              echo "::error::$name regression suite failed"
              tail -80 "evidence/$name-tests.txt"
              result=1
            fi
            (cd "$name" && git diff --check) || result=1
          done
          if ! (cd exp-core && node scripts/check-suite-coexistence.cjs) > evidence/coexistence.txt 2>&1; then cat evidence/coexistence.txt; result=1; fi
          exit "$result"
      - name: Commit only the tested Core release candidate
        shell: bash
        run: |
          set -euo pipefail
          for name in Dropper SHIFT WARD PRISMA; do
            (cd "$name" && zip -q -r "../evidence/$name-candidate.zip" src tests scripts vendor package.json package-lock.json *.user.js README.md CHANGELOG.md)
          done
          cd exp-core
          sha256sum dist/exp-core.js dist/manifest.json > ../evidence/core-sha256.txt
          npm run build
          sha256sum --check ../evidence/core-sha256.txt
          git rm -r .release-staging .github/workflows/integrate-core-menu.yml
          git add src tests scripts package.json package-lock.json README.md CHANGELOG.md dist
          git -c user.name=expDARE -c user.email=5340947+ExtraPotions@users.noreply.github.com commit -m 'Prepare exp-core 3.4.10 shared menu controller'
          git push origin HEAD:refs/heads/release/core-menu-3.4.10
          git archive --format=zip --output=../evidence/exp-core-candidate.zip HEAD
      - name: Retain source and regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-menu-integration-${{ github.run_id }}
          path: |
            evidence/
            exp-core/test-artifacts/
            Dropper/test-artifacts/
          retention-days: 7
          if-no-files-found: error
