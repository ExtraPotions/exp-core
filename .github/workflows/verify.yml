name: Verify Core

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned Dropper reference
        run: npm run extract:check
      - name: Verify generated Core bundle
        run: npm run build:check
      - name: Run Core regression suite
        run: node --test tests/*.test.cjs
