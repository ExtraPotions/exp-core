name: Core consumer rollout

on:
  workflow_call:
    inputs:
      tag:
        description: Optional exp-core tag. Blank uses the latest published Core release.
        required: false
        type: string
        default: ""
      product:
        description: Product display name used for the release commit and title.
        required: true
        type: string
      node-version:
        description: Node.js version used by the consumer.
        required: false
        type: string
        default: "22"
      script-asset:
        description: Built userscript asset path.
        required: true
        type: string
      icon-asset:
        description: Launcher/icon asset path.
        required: true
        type: string
      release-sections:
        description: Number of changelog sections included in the GitHub release notes.
        required: false
        type: number
        default: 1

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      - name: Sync latest released Core
        env:
          REQUESTED_CORE_TAG: ${{ inputs.tag }}
        run: node scripts/sync-exp-core.cjs "$REQUESTED_CORE_TAG"

      - name: Detect Core changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- vendor/exp-core; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare consumer patch release
        if: steps.changed.outputs.value == 'true'
        run: node scripts/prepare-core-release.cjs

      - name: Install browser runtime
        if: steps.changed.outputs.value == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify pinned Core
        if: steps.changed.outputs.value == 'true'
        run: node scripts/verify-exp-core-pin.cjs

      - name: Rebuild and test consumer
        if: steps.changed.outputs.value == 'true'
        run: npm test

      - name: Commit Core-driven patch release
        if: steps.changed.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release ${{ inputs.product }} $version"
          git push origin HEAD:main

      - name: Publish Core-driven release
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          SCRIPT_ASSET: ${{ inputs.script-asset }}
          ICON_ASSET: ${{ inputs.icon-asset }}
          RELEASE_SECTIONS: ${{ inputs.release-sections }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          awk -v limit="$RELEASE_SECTIONS" '
            /^## / { section += 1; if (section > limit) exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          sha256sum "$SCRIPT_ASSET" > SHA256SUMS
          sha256sum "$ICON_ASSET" >> SHA256SUMS
          gh release create "$tag" "$SCRIPT_ASSET" "$ICON_ASSET" SHA256SUMS \
            --target "$(git rev-parse HEAD)" \
            --title "$PRODUCT $tag" \
            --notes-file release-notes.md
